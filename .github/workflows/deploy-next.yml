name: Deploy Next.js Worker

on:
    push:
        branches: [main]
    workflow_dispatch: {}

# Serialize deploys so two pushes to main can't race the single prod Worker
# (last-writer-wins). cancel-in-progress stays false: never abort a deploy
# that's mid-flight, just queue the next one behind it.
concurrency:
    group: deploy-next
    cancel-in-progress: false

jobs:
    # Same gates as ci.yml, run inline so a red check blocks the deploy instead
    # of failing in a parallel workflow nobody looks at. Main had four red CI
    # runs ship to prod before this job existed.
    checks:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: next
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v6
              with:
                  version: 9

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
                  cache-dependency-path: next/pnpm-lock.yaml

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Format check
              run: pnpm format:check

            - name: Type-check
              run: pnpm exec tsc --noEmit

            - name: Test
              run: pnpm test

            - name: Notifier install
              working-directory: notifier
              run: npm ci

            - name: Notifier format check
              working-directory: notifier
              run: npm run format:check

            - name: Notifier type-check
              working-directory: notifier
              run: npm run typecheck

            - name: Notifier test
              working-directory: notifier
              run: npm test

    deploy:
        needs: checks
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: next
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v6
              with:
                  version: 9

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
                  cache-dependency-path: next/pnpm-lock.yaml

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Build for Cloudflare Workers
              run: pnpm run cf:build
              env:
                  # Inlined into the client bundle at build time for Web Push
                  # subscribe. Until this repo secret is set, the value is empty
                  # and the account push toggle stays inert (email-only).
                  NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

            - name: Deploy Worker
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: next
                  command: deploy
                  secrets: |
                      API_SECRET
                      CONFIG_KEY
                      GOOGLE_CLIENT_ID
                      GOOGLE_CLIENT_SECRET
                      SESSION_SECRET
                      BOOTSTRAP_ADMIN_EMAIL
                      VAPID_PRIVATE_JWK
              env:
                  API_SECRET: ${{ secrets.SUBSCRIBER_API_SECRET }}
                  CONFIG_KEY: ${{ secrets.CONFIG_KEY }}
                  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
                  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
                  SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
                  BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
                  VAPID_PRIVATE_JWK: ${{ secrets.VAPID_PRIVATE_JWK }}

            # The homepage stats band and the notifier both depend on this route.
            # Retry briefly so a cold isolate right after deploy doesn't read as red.
            - name: Smoke test
              working-directory: .
              run: |
                  for attempt in 1 2 3 4 5; do
                      if curl -fsS --max-time 15 https://campwatch.dev/api/stats > /dev/null; then
                          echo "api/stats responded"
                          exit 0
                      fi
                      echo "attempt $attempt failed, retrying"
                      sleep 5
                  done
                  echo "campwatch.dev/api/stats did not respond after deploy"
                  exit 1

    deploy-notifier:
        needs: checks
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: notifier
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
            - name: Install notifier dependencies
              run: npm ci
            - name: Deploy notifier Worker
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: notifier
                  command: deploy
                  secrets: |
                      RESEND_API_KEY
                      SUBSCRIBER_API_SECRET
                      VAPID_PRIVATE_JWK
              env:
                  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
                  SUBSCRIBER_API_SECRET: ${{ secrets.SUBSCRIBER_API_SECRET }}
                  VAPID_PRIVATE_JWK: ${{ secrets.VAPID_PRIVATE_JWK }}
              # HEARTBEAT_URL is optional and set out-of-band when you wire up a
              # dead-man's-switch monitor:
              #   printf '%s' '<url>' | npx wrangler secret put HEARTBEAT_URL
              # (kept out of this list so an unset value doesn't fail the deploy).
